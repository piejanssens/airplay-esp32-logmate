services:
  airplay-esp32-logmate:
    build: .
    container_name: airplay-esp32-logmate
    restart: unless-stopped
    network_mode: bridge  # switch to "host" if your devices are only reachable on the LAN
                          # interface and container bridge networking can't route to them
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    environment:
      - TZ=Europe/Brussels
      - RECONNECT_DELAY=5